<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Compressor</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Audio Compressor</h1>
        </div>
        
        <div class="controls">
            <div class="toggle-section">
                <label class="toggle-label">Compression</label>
                <button id="toggleBtn" class="toggle-btn">
                    <span class="toggle-text">OFF</span>
                </button>
            </div>
            
            <div class="gain-section">
                <label class="gain-label">Gain</label>
                <div class="gain-controls">
                    <input type="range" id="gainSlider" min="0" max="2" step="0.1" value="1.0" class="gain-slider">
                    <span id="gainValue" class="gain-value">1.0</span>
                </div>
            </div>
        </div>
        
        <div class="status">
            <span id="statusText" class="status-text">Ready</span>
        </div>

        <div class="options-link">
            <button id="optionsBtn" class="options-btn">⚙️ Extension Options</button>
        </div>
    </div>

    <script src="scripts/popup.ts"></script>
</body>
</html>
